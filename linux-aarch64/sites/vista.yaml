# TACC Vista (NVIDIA Grace-Grace, aarch64)
# Rocky 9, system gcc@11.5.0 (/usr/bin/gcc)
#
# Setup:  cd linux-aarch64 && ln -s sites/vista.yaml site.yaml
#
# Uses system gcc 11.5.0 rather than the module gcc 13.2.0, which has a
# broken libisl.so.23 rpath in cc1 that spack cannot work around (spack
# strips LD_LIBRARY_PATH in the build sandbox). CASA requires gcc 4.9+
# (9+ for GPU builds), so 11.5.0 is sufficient.

packages:
  gcc:
    externals:
    - spec: gcc@11.5.0 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
